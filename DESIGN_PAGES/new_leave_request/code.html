<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>طلب إجازة جديد</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Tajawal:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-highest": "#e1e3e4",
              "primary-fixed-dim": "#ffb783",
              "on-secondary": "#ffffff",
              "tertiary": "#00658f",
              "surface-tint": "#944a00",
              "primary": "#944a00",
              "on-primary-fixed": "#301400",
              "tertiary-fixed-dim": "#86cfff",
              "surface-container-lowest": "#ffffff",
              "error": "#ba1a1a",
              "inverse-primary": "#ffb783",
              "secondary": "#4e6073",
              "surface-container-high": "#e7e8e9",
              "on-secondary-container": "#526478",
              "error-container": "#ffdad6",
              "surface-variant": "#e1e3e4",
              "on-background": "#191c1d",
              "on-surface-variant": "#564337",
              "secondary-container": "#cfe2f9",
              "on-surface": "#191c1d",
              "surface-container-low": "#f3f4f5",
              "on-primary-container": "#502600",
              "tertiary-container": "#00a3e4",
              "surface-container": "#edeeef",
              "secondary-fixed-dim": "#b5c8df",
              "background": "#f8f9fa",
              "on-secondary-fixed": "#091d2e",
              "outline": "#897365",
              "on-secondary-fixed-variant": "#36485b",
              "on-error": "#ffffff",
              "primary-fixed": "#ffdcc5",
              "inverse-on-surface": "#f0f1f2",
              "on-tertiary-fixed": "#001e2e",
              "on-primary-fixed-variant": "#713700",
              "inverse-surface": "#2e3132",
              "on-tertiary-container": "#00354d",
              "on-tertiary": "#ffffff",
              "surface-bright": "#f8f9fa",
              "surface": "#f8f9fa",
              "on-tertiary-fixed-variant": "#004c6d",
              "surface-dim": "#d9dadb",
              "secondary-fixed": "#d1e4fb",
              "on-primary": "#ffffff",
              "on-error-container": "#93000a",
              "tertiary-fixed": "#c7e7ff",
              "primary-container": "#e67e22",
              "outline-variant": "#dcc1b1"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans", "Tajawal"],
              "body": ["Plus Jakarta Sans", "Tajawal"],
              "label": ["Plus Jakarta Sans", "Tajawal"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "1rem", "xl": "1.25rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      body {
        font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-effect {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .primary-gradient {
        background: linear-gradient(135deg, #944a00 0%, #e67e22 100%);
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        box-shadow: none;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl shadow-[0_20px_40px_rgba(25,28,29,0.06)]">
<div class="flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-orange-800 dark:text-orange-400">arrow_forward</span>
</button>
<h1 class="font-headline text-lg font-semibold tracking-tight text-orange-800 dark:text-orange-400">طلب إجازة جديد</h1>
</div>
<div class="w-10"></div>
</div>
<div class="bg-gradient-to-b from-gray-100 to-transparent dark:from-gray-800 h-px"></div>
</header>
<main class="max-w-2xl mx-auto px-6 py-8 space-y-8">
<!-- Summary / Balance Card -->
<section class="bg-primary-fixed rounded-xl p-6 relative overflow-hidden">
<div class="relative z-10 flex items-center justify-between">
<div>
<p class="text-on-primary-fixed-variant text-sm font-medium mb-1">رصيد الإجازات المتاح</p>
<div class="flex items-baseline gap-2">
<span class="text-4xl font-bold text-on-primary-fixed">14</span>
<span class="text-on-primary-fixed-variant font-medium">يوم عمل</span>
</div>
</div>
<div class="w-16 h-16 bg-white/30 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-fixed text-3xl" style="font-variation-settings: 'FILL' 1;">calendar_month</span>
</div>
</div>
<div class="absolute -bottom-6 -left-6 w-32 h-32 bg-primary/10 rounded-full blur-3xl"></div>
</section>
<!-- Form Section -->
<section class="space-y-6">
<!-- Leave Type -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant px-1">نوع الإجازة</label>
<div class="relative group">
<select class="w-full bg-surface-container-low border-none rounded-lg px-4 py-4 appearance-none focus:ring-0 text-on-surface transition-all">
<option value="annual">إجازة سنوية</option>
<option value="sick">إجازة مرضية</option>
<option value="emergency">إجازة اضطرارية</option>
<option value="unpaid">إجازة بدون راتب</option>
</select>
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-[2px] bg-primary group-focus-within:w-full transition-all duration-300"></div>
</div>
</div>
<!-- Date Fields (Bento Style Grid) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant px-1">تاريخ البدء</label>
<div class="relative group bg-surface-container-lowest shadow-sm rounded-lg">
<input class="w-full bg-transparent border-none rounded-lg px-4 py-4 focus:ring-0 text-on-surface" type="date"/>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-[2px] bg-primary group-focus-within:w-full transition-all duration-300"></div>
</div>
</div>
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant px-1">تاريخ الانتهاء</label>
<div class="relative group bg-surface-container-lowest shadow-sm rounded-lg">
<input class="w-full bg-transparent border-none rounded-lg px-4 py-4 focus:ring-0 text-on-surface" type="date"/>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-[2px] bg-primary group-focus-within:w-full transition-all duration-300"></div>
</div>
</div>
</div>
<!-- Reason TextArea -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant px-1">السبب / المبرر</label>
<div class="relative group">
<textarea class="w-full bg-surface-container-low border-none rounded-lg px-4 py-4 focus:ring-0 text-on-surface resize-none" placeholder="يرجى كتابة تفاصيل الطلب هنا..." rows="4"></textarea>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-[2px] bg-primary group-focus-within:w-full transition-all duration-300"></div>
</div>
</div>
<!-- Attachments -->
<div class="space-y-2">
<label class="block text-sm font-bold text-on-surface-variant px-1">المرفقات (اختياري)</label>
<div class="border-2 border-dashed border-outline-variant/30 rounded-xl p-8 flex flex-col items-center justify-center gap-3 bg-surface-container-lowest hover:bg-orange-50/30 transition-colors cursor-pointer group">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">cloud_upload</span>
</div>
<div class="text-center">
<p class="text-on-surface font-medium">اضغط هنا لرفع الملفات</p>
<p class="text-xs text-on-surface-variant mt-1">PDF, JPG, PNG (بحد أقصى 5 ميجا)</p>
</div>
</div>
</div>
</section>
<!-- Main CTA -->
<div class="pt-4">
<button class="primary-gradient w-full py-4 rounded-full text-white font-bold text-lg shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>إرسال الطلب</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'opsz' 20;">send</span>
</button>
<button class="w-full mt-4 py-3 rounded-full text-primary font-medium hover:bg-primary/5 transition-colors">
                إلغاء الطلب
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-white/80 dark:bg-gray-950/80 backdrop-blur-xl rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.03)] border-t border-gray-100/10">
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-5 py-2 hover:text-orange-600 dark:hover:text-orange-300 transition-all active:scale-90" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-[11px] font-medium mt-1">الرئيسية</span>
</a>
<a class="flex flex-col items-center justify-center bg-orange-50 dark:bg-orange-900/20 text-orange-800 dark:text-orange-200 rounded-2xl px-5 py-2 transition-all active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">assignment</span>
<span class="font-label text-[11px] font-medium mt-1">الطلبات</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-5 py-2 hover:text-orange-600 dark:hover:text-orange-300 transition-all active:scale-90" href="#">
<span class="material-symbols-outlined">calendar_today</span>
<span class="font-label text-[11px] font-medium mt-1">الجداول</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-5 py-2 hover:text-orange-600 dark:hover:text-orange-300 transition-all active:scale-90" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label text-[11px] font-medium mt-1">الملف</span>
</a>
</nav>
</body></html>
