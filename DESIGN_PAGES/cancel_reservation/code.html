<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary": "#4e6073",
              "on-primary-fixed": "#301400",
              "on-secondary": "#ffffff",
              "on-error-container": "#93000a",
              "surface-variant": "#e1e3e4",
              "surface-tint": "#944a00",
              "outline": "#897365",
              "on-surface": "#191c1d",
              "error": "#ba1a1a",
              "surface-dim": "#d9dadb",
              "on-primary-fixed-variant": "#713700",
              "tertiary-container": "#00a3e4",
              "on-secondary-container": "#526478",
              "background": "#f8f9fa",
              "surface-bright": "#f8f9fa",
              "primary-container": "#e67e22",
              "inverse-surface": "#2e3132",
              "surface": "#f8f9fa",
              "surface-container-highest": "#e1e3e4",
              "outline-variant": "#dcc1b1",
              "inverse-primary": "#ffb783",
              "inverse-on-surface": "#f0f1f2",
              "on-background": "#191c1d",
              "tertiary-fixed-dim": "#86cfff",
              "secondary-container": "#cfe2f9",
              "on-surface-variant": "#564337",
              "on-secondary-fixed": "#091d2e",
              "on-error": "#ffffff",
              "tertiary-fixed": "#c7e7ff",
              "on-tertiary-fixed": "#001e2e",
              "surface-container": "#edeeef",
              "surface-container-low": "#f3f4f5",
              "on-tertiary-fixed-variant": "#004c6d",
              "on-primary": "#ffffff",
              "tertiary": "#00658f",
              "error-container": "#ffdad6",
              "on-secondary-fixed-variant": "#36485b",
              "secondary-fixed-dim": "#b5c8df",
              "primary-fixed": "#ffdcc5",
              "surface-container-lowest": "#ffffff",
              "surface-container-high": "#e7e8e9",
              "primary-fixed-dim": "#ffb783",
              "primary": "#944a00",
              "secondary-fixed": "#d1e4fb",
              "on-primary-container": "#502600",
              "on-tertiary-container": "#00354d",
              "on-tertiary": "#ffffff"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans", "Tajawal"],
              "body": ["Plus Jakarta Sans", "Tajawal"],
              "label": ["Plus Jakarta Sans", "Tajawal"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "1rem", "xl": "1.25rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Tajawal', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-[#F8F9FA] dark:bg-gray-900">
<div class="flex items-center justify-between px-6 py-4 w-full max-w-4xl mx-auto flex-row-reverse">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#944A00] dark:text-[#E67E22] cursor-pointer active:scale-95 duration-200">arrow_forward</span>
<h1 class="font-['Plus_Jakarta_Sans','Tajawal'] font-bold text-lg text-on-surface">إلغاء الحجز</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</div>
</div>
<div class="bg-[#F3F4F5] dark:bg-gray-800 h-px w-full opacity-15"></div>
</header>
<main class="max-w-xl mx-auto px-6 pt-8">
<!-- Guest Identity Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 mb-8 flex items-center gap-6 shadow-[0_20px_40px_rgba(25,28,29,0.04)]">
<div class="w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed font-bold text-2xl overflow-hidden">
<img class="w-full h-full object-cover" data-alt="Portrait of an elegant middle-eastern man" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBRTj-HPUvz_dxuX1TPH4BKi6ce1jivyLMESYFkQQRHsNDermDePpfRTSpsWaetl2lTt6J9x2DOjYIGiJTPY0vsYL5dDgX-oq1ZZ_QF_ZHhF3CfkuAVCLnw_V0eZP1sCgXwZ2iHK3ivxWcU2UjRFjreomsNaZDwPyOxNcZ8YIJieaWewCVFpmjhryApW59r6Z4MHgxD9sds2SeeHjXTlNH3M9y2O_VTAiOSrUCPgNr9Aw82u2-6w1TrQ2r45xeGRDs0rGDWDxbfuXI"/>
</div>
<div class="flex flex-col">
<span class="text-label-md text-on-secondary-fixed-variant mb-1">الضيف</span>
<h2 class="text-xl font-bold text-on-surface">ياسين الفايد</h2>
<div class="flex items-center gap-2 mt-2">
<span class="material-symbols-outlined text-sm text-primary">calendar_today</span>
<span class="text-sm text-on-surface-variant">اليوم، 08:30 مساءً</span>
</div>
</div>
</div>
<!-- Cancellation Message -->
<div class="mb-10 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 bg-error-container rounded-full mb-4">
<span class="material-symbols-outlined text-error text-3xl" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<h3 class="text-lg font-bold text-on-surface mb-2">هل أنت متأكد من إلغاء هذا الحجز؟</h3>
<p class="text-on-surface-variant leading-relaxed">بمجرد التأكيد، سيتم تحرير الطاولة رقم 12 وإرسال إشعار للعميل.</p>
</div>
<!-- Cancellation Reasons Grid -->
<section class="space-y-4">
<label class="block text-sm font-bold text-on-surface-variant px-1 mb-4">سبب الإلغاء</label>
<div class="grid grid-cols-1 gap-3">
<!-- Option 1 -->
<button class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl hover:bg-surface-container-high transition-colors group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">event_busy</span>
<span class="font-medium">تغيير في الخطط</span>
</div>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant"></div>
</button>
<!-- Option 2 -->
<button class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl hover:bg-surface-container-high transition-colors group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">emergency</span>
<span class="font-medium">ظرف طارئ</span>
</div>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant"></div>
</button>
<!-- Option 3 (Selected State Example) -->
<button class="flex items-center justify-between p-4 bg-primary-fixed rounded-xl border-2 border-primary transition-colors group ring-4 ring-primary/5">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">edit_square</span>
<span class="font-bold text-on-primary-fixed">خطأ في الحجز</span>
</div>
<div class="w-5 h-5 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[16px] font-bold">check</span>
</div>
</button>
<!-- Custom Reason -->
<div class="mt-4">
<label class="block text-xs font-medium text-on-secondary-fixed-variant mb-2 px-1">ملاحظات إضافية (اختياري)</label>
<textarea class="w-full bg-surface-container-highest border-0 border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-t-lg p-4 text-on-surface min-h-[100px] transition-all" placeholder="اكتب السبب هنا..."></textarea>
</div>
</div>
</section>
<!-- Action Buttons -->
<div class="flex flex-col gap-3 mt-12">
<button class="w-full py-4 rounded-full bg-gradient-to-br from-error to-[#93000a] text-white font-bold text-lg shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined">cancel</span>
                تأكيد الإلغاء
            </button>
<button class="w-full py-4 rounded-full bg-surface-container-low text-on-surface-variant font-bold text-lg hover:bg-surface-container-high active:scale-95 transition-transform">
                تراجع
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-2xl bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl border-t border-[#191C1D]/15 shadow-[0_-10px_30px_rgba(25,28,29,0.04)]">
<div class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-4 pt-2 flex-row-reverse">
<!-- Home -->
<div class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-4 py-1 hover:bg-[#F3F4F5] dark:hover:bg-gray-800 active:scale-90 transition-transform">
<span class="material-symbols-outlined">home</span>
<span class="font-['Tajawal'] text-xs font-medium">الرئيسية</span>
</div>
<!-- Bookings (Active) -->
<div class="flex flex-col items-center justify-center bg-[#FFDCC5] dark:bg-[#944A00]/20 text-[#944A00] dark:text-[#E67E22] rounded-xl px-4 py-1 active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">event_available</span>
<span class="font-['Tajawal'] text-xs font-medium">الحجوزات</span>
</div>
<!-- Tables -->
<div class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-4 py-1 hover:bg-[#F3F4F5] dark:hover:bg-gray-800 active:scale-90 transition-transform">
<span class="material-symbols-outlined">restaurant</span>
<span class="font-['Tajawal'] text-xs font-medium">الطاولات</span>
</div>
<!-- Settings -->
<div class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 px-4 py-1 hover:bg-[#F3F4F5] dark:hover:bg-gray-800 active:scale-90 transition-transform">
<span class="material-symbols-outlined">settings</span>
<span class="font-['Tajawal'] text-xs font-medium">الإعدادات</span>
</div>
</div>
</nav>
</body></html>
