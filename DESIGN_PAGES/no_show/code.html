<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>تسجيل عدم حضور - CRM</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "surface-dim": "#d9dadb",

                        "tertiary-container": "#00a3e4",
                        "on-secondary-container": "#526478",
                        "background": "#f8f9fa",
                        "surface-bright": "#f8f9fa",
                        "primary-container": "#e67e22",
                        "inverse-surface": "#2e3132",
                        "surface": "#f8f9fa",
                        "surface-container-highest": "#e1e3e4",
                        "outline-variant": "#dcc1b1",
                        "inverse-primary": "#ffb783",
                        "inverse-on-surface": "#f0f1f2",
                        "on-background": "#191c1d",

                        "secondary-container": "#cfe2f9",

                        "on-secondary-fixed": "#091d2e",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#c7e7ff",
                        "on-tertiary-fixed": "#001e2e",

                        "surface-container-high": "#e7e8e9",

                        "headline": ["Plus Jakarta Sans", "Tajawal"],

                    borderRadius: { "DEFAULT": "0.25rem", "lg": "1rem", "xl": "1.25rem", "full": "9999px" },
                },

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-[#F8F9FA] dark:bg-gray-900 shadow-none">
<div class="flex items-center justify-between px-6 py-4 w-full max-w-4xl mx-auto flex-row-reverse">
<div class="flex items-center gap-4">
<h1 class="font-['Plus_Jakarta_Sans','Tajawal'] font-bold text-lg text-[#944A00] dark:text-[#E67E22]">تفاصيل الحجز</h1>
</div>
<button class="flex items-center justify-center p-2 rounded-full hover:bg-[#F3F4F5] dark:hover:bg-gray-800 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[#944A00] dark:text-[#E67E22]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<div class="bg-[#F3F4F5] dark:bg-gray-800 h-px w-full opacity-15"></div>
</header>
<main class="flex-grow flex items-center justify-center px-6 py-12">
<div class="w-full max-w-lg">
<!-- Content Canvas -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_20px_40px_rgba(25,28,29,0.06)] relative overflow-hidden border-b-4 border-error">
<!-- Status Icon Section -->
<div class="flex justify-center mb-8">
<div class="relative">
<div class="absolute inset-0 bg-error-container opacity-20 blur-2xl rounded-full"></div>
<div class="relative bg-error-container text-error p-6 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-5xl" data-icon="person_off">person_off</span>
</div>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-4">
<h2 class="text-3xl font-bold font-headline text-on-surface">تسجيل عدم حضور</h2>
<div class="inline-block px-4 py-2 bg-surface-container rounded-full text-on-surface-variant font-semibold text-lg mb-4">
                        ياسين الفايد
                    </div>
<p class="text-on-secondary-fixed-variant leading-relaxed text-lg max-w-xs mx-auto">
                        هل تريد تسجيل الضيف كغير حاضر؟ سيؤثر ذلك على سجل العميل.
                    </p>
</div>
<!-- Bento Info Grid (Subtle Details) -->
<div class="grid grid-cols-2 gap-4 mt-10">
<div class="bg-surface-container-low p-4 rounded-lg flex flex-col items-center justify-center space-y-1">
<span class="text-xs text-on-surface-variant">وقت الحجز</span>
<span class="font-bold text-on-surface">08:30 مساءً</span>
</div>
<div class="bg-surface-container-low p-4 rounded-lg flex flex-col items-center justify-center space-y-1">
<span class="text-xs text-on-surface-variant">رقم الطاولة</span>
<span class="font-bold text-on-surface">طاولة 12</span>
</div>
</div>
<!-- Actions -->
<div class="mt-10 flex flex-col gap-3">
<button class="w-full bg-error text-on-error py-4 rounded-full font-bold text-lg shadow-lg shadow-error/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                        تأكيد عدم الحضور
                    </button>
<button class="w-full bg-transparent text-secondary py-4 rounded-full font-bold text-lg hover:bg-surface-container transition-colors active:scale-[0.98]">
                        تراجع
                    </button>
</div>
</div>
<!-- Warning Note -->
<div class="mt-6 flex items-start gap-3 px-4 py-3 bg-secondary-container/30 rounded-lg text-sm text-on-secondary-container">
<span class="material-symbols-outlined text-lg shrink-0" data-icon="info">info</span>
<p>سيتم تحديث نسبة الحضور الخاصة بهذا العميل تلقائياً، وقد يؤثر ذلك على أولوية الحجوزات المستقبلية.</p>
</div>
</div>
</main>
<!-- BottomNavBar is suppressed as this is a Task-Focused sub-page (Confirmation Modal style) -->
</body></html>
